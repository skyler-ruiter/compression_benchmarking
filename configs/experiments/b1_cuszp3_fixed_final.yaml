name: b1_cuszp3_fixed_final
description: >-
  Corrected dimension-aware B1 comparison for cuSZp3 fixed mode. The earlier
  cuszp3_fixed_rerun experiment accidentally invoked native `fixed` without a
  dimension suffix, which the adapter defines as 1-D, while FZGM used 8x8 and
  4x4x4 tiles. This diagnostic samples one field from each covered dataset and
  explicitly invokes native fixed:2d or fixed:3d. Results support compressed
  size and reconstruction fidelity only.

datasets: [CESM-2D, CESMATM-3D, HURR, NYX, MIRANDA, QMCPACK-3D, SCALE-LETKF, S3D, EXAFEL]
fields:
  CESM-2D: [CLDHGH]
  CESMATM-3D: [DTV]
  HURR: [CLOUD]
  NYX: [temperature]
  MIRANDA: [density]
  QMCPACK-3D: [orbital_000]
  SCALE-LETKF: [T]
  S3D: [TEMP]
  EXAFEL: [data]

error:
  mode: rel_range
  bounds: [1.0e-2, 1.0e-3, 1.0e-4]

repetitions: 1
warmup_reps: 0
lock_clocks: true
retain_decompressed: false
retain_compressed: false

x-fzgm-tool: &fzgm_tool
  tool_version: 2.0.0-dev
  tool_source_commit: d511ebcb447194dd90cc452ce073dffc9ee78403
  tool_build_flags: Release;CUDA;sm_90;clean source;FZ_SPECIALIZE=off
  tool_patch_sha256: clean

x-cuszp3-tool: &cuszp3_tool
  tool_version: 3.0.0
  tool_source_commit: da90afb42770fcef6129cb586cf185c7d54c614c
  tool_build_flags: Release;CUDA;GPU-arch captured in session;recipe=compressors/build/cuszp3.sh
  tool_patch_sha256: c55b20ff1477f0cbf76247da9a879f5d0a94aac6063e17beefd32340ebe633bb

runs:
  - {<<: *cuszp3_tool, compressor: cuszp3, variant: cuszp3_fixed_2d_b1,
     pipeline: "fixed:2d", only_datasets: [CESM-2D]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_fixed_b1,
     pipeline: configs/pipelines/cuszp3_2d_fixed.toml, only_datasets: [CESM-2D]}
  - {<<: *cuszp3_tool, compressor: cuszp3, variant: cuszp3_fixed_3d_b1,
     pipeline: "fixed:3d",
     only_datasets: [CESMATM-3D, HURR, NYX, MIRANDA, QMCPACK-3D, SCALE-LETKF, S3D, EXAFEL]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_fixed_b1,
     pipeline: configs/pipelines/cuszp3_3d_fixed.toml,
     only_datasets: [CESMATM-3D, HURR, NYX, MIRANDA, QMCPACK-3D, SCALE-LETKF, S3D, EXAFEL]}

verification:
  accepted_exclusions:
    - codes: [degenerate_field]
      match: {dataset: S3D}
      reason: A degenerate sampled field cannot support rate-distortion comparison.
    - codes: [eb_violated_severe]
      match: {compressor: cuszp3, dataset: CESM-2D}
      reason: >-
        The confirmation run checks the severe native fixed:2d reconstruction
        failures observed in the dimension-correct pilot; affected pairs are
        excluded from compressed-size aggregation.
    - codes: [eb_violated_severe]
      match: {compressor: cuszp3, dataset: S3D}
      reason: >-
        The confirmation run checks the severe native fixed:3d reconstruction
        failures observed in the dimension-correct pilot; affected pairs are
        excluded from compressed-size aggregation.
  accepted_unreliable_timing:
    - match: {compressor: cuszp3}
      reason: This experiment supports compressed-size and quality claims only.
    - match: {compressor: fzgm}
      reason: This experiment supports compressed-size and quality claims only.
