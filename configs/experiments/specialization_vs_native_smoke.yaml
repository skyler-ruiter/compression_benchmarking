# Pipeline Specialization vs. native — cross-machine throughput/CR/memory smoke.
#
# The refreshed FZGM-vs-native comparison, run AFTER the 2026-08/09 optimization
# work: generalized warp-register fusion (any block = 32*EPL, plain + outlier),
# warp-register *decompress* fusion, chunk-cooperative decompress fusion, and
# specialization-aware buffer coloring. This is the 5-field preflight; a
# full-corpus counterpart is a follow-up once these numbers look right on 2-3
# machines.
#
# ---------------------------------------------------------------------------
# HOW TO RUN — two launches of THIS file, distinguished only by environment
# ---------------------------------------------------------------------------
#   FZ_SPECIALIZE=off  python -m benchkit run configs/experiments/specialization_vs_native_smoke.yaml \
#       --session-id specialization-vs-native-smoke-<host>-staged-<date>
#   FZ_SPECIALIZE=auto python -m benchkit run configs/experiments/specialization_vs_native_smoke.yaml \
#       --session-id specialization-vs-native-smoke-<host>-auto-<date>
#
# FZ_SPECIALIZE overrides the pipeline's finalize-time specialization policy
# (FZGM compressor.cpp planAndInstallFusion); `auto` = FZGM specialized (kernel
# fusion + single-pass decoupled-lookback, both compress and decompress), `off` =
# FZGM staged (one kernel per stage). It is recorded in the session's resume
# identity (benchkit runner _FZGM_BEHAVIOR_ENV), so the two sessions do not
# collide. The native rows are separate binaries, unaffected by FZ_SPECIALIZE;
# they re-measure consistently across both sessions and are the cross-check.
#
# scripts/run-specialization-smoke.sh does both launches + verify + a combined
# report. Use that unless you are iterating.
#
# ---------------------------------------------------------------------------
# THE MATRIX — three FZGM arms per native compressor
# ---------------------------------------------------------------------------
#   <native>          the reference binary (cusz / cuszp2 / cuszp3 / fzgpu / pfpl)
#   fzgm ..._hp       the current vs-native FZGM preset (linear_high_precision
#                     quant — used for tight-bound CR/quality parity). This chain
#                     CANNOT specialize (high-precision quant is gated out), so its
#                     `auto` session numbers == its `off` session numbers: it is
#                     the "modular but staged" point.
#   fzgm ..._sp       the specialization-ready preset (plain linear quant, the same
#                     arithmetic native cuSZp actually does). Staged in the `off`
#                     session, fused in the `auto` session — the delta between the
#                     two sessions for these rows is the specialization gain, and it
#                     is a CONTROLLED A/B: the compressed payload is byte-identical
#                     off vs auto (only an 8-byte FZM header checksum differs — the
#                     data_checksum and the reconstruction match), so any CR change
#                     between the two sessions would be a bug. NB the plain-mode _sp
#                     presets are clean plain packing (outlier_selection = false),
#                     NOT the cuszp2_plainfused / cuszp3_*_plainfused trick
#                     (outlier_selection = true + fused_coder = PlainBitpackCoder) —
#                     that one's staged run has adaptive/outlier semantics and its
#                     fused run forces plain, so it is a fused-vs-NATIVE row only,
#                     never a staged<->fused A/B, and is deliberately not used here.
#
# So each cell yields, across the two sessions: native, FZGM-staged(hp),
# FZGM-staged(sp), FZGM-specialized(sp). Compress AND decompress throughput, CR,
# PSNR, eb-satisfaction, and peak device memory are captured for every row
# (decompress_throughput_gbs / peak_device_mb are first-class row fields).
#
#   python -m benchkit report results/<session>/ --aggregate
#
# ---------------------------------------------------------------------------
# Structural notes
# ---------------------------------------------------------------------------
#   - cusz / fzgpu / cuszp3_fixed never specialize (Huffman entropy stage,
#     FZ-GPU's bitshuffle shape, or no block-local predictor). One fzgm row each;
#     kept so the table has the full family and explicit off/auto controls.
#   - cuszp3 (TiledLorenzo) now specializes BOTH directions: the warp inverse
#     reconstructs each tile by the separable prefix sum + scatters to natural
#     row-major (fused_unpack_tiled_body). The 3-D gain is small (~1.05-1.12x
#     decompress) because the 3-D predictor is roofline/compute-bound — the same
#     reason the 3-D forward gain is small. 2-D is ~1.35-1.43x.
#   - pfpl specializes via the chunk-cooperative path (1 preset, no _hp/_sp split).
#   - szp_composed has no native SZp CLI in this repo: FZGM-only showcase row.
#   - HACC is 1-D: cuszp3 there is native's 1-D Lorenzo(block=32); the FZGM _sp
#     equivalent is the block-32 cuszp2_*_sp preset (identical chain).
#   - cuszp3_*_plain_sp use clean plain packing (outlier_selection = false), which
#     fuses forward AND inverse byte-identically.

name: specialization_vs_native_smoke
description: >
  Pipeline Specialization vs native for cusz, cuszp2 (plain/outlier), cuszp3
  (fixed/plain/outlier, dim-matched), fzgpu, pfpl, plus an FZGM-only
  SZp-inspired szp_composed
  showcase — 4 shape-class fields plus the offset-dominated CESM-2D/PSL
  specialization-regression field, eb in {1e-2,1e-3,1e-4}, rel_range. Run twice
  (FZ_SPECIALIZE=off then auto).

datasets:
  - CESM-2D
  - HURR
  - NYX
  - HACC

fields:
  CESM-2D: [CLDHGH, PSL]
  HURR:    [TC]
  NYX:     [temperature]
  HACC:    [vx]

error:
  mode: rel_range
  bounds: [1.0e-2, 1.0e-3, 1.0e-4]

repetitions: 5
warmup_reps: 1
lock_clocks: true          # single-tenant VM: run scripts/lock_clocks.sh first.
                           # Inert where clock control is admin-only (BigRed200 /
                           # Delta) — use --exclusive there instead (D15).
retain_decompressed: false
retain_compressed: false

x-fzgm-tool: &fzgm_tool
  tool_version: 2.0.0-dev
  tool_source_commit: d511ebcb447194dd90cc452ce073dffc9ee78403
  tool_build_flags: Release;backend/GPU-arch/toolchain captured in session build_environment
  tool_patch_sha256: clean

x-cusz-tool: &cusz_tool
  tool_version: 0.17.3
  tool_source_commit: e1c0135f2309921e13e7dac72c00101381e60c23
  tool_build_flags: Release;PSZ_BACKEND=cuda;PSZ_BUILD_EXAMPLES=on;GPU-arch captured in session;recipe=compressors/build/cusz.sh
  tool_patch_sha256: 0369a8d48e19f9102b01678571e52a42889444f35bfdd6da955f022614a45fd9

x-cuszp2-tool: &cuszp2_tool
  tool_version: 2.0.1
  tool_source_commit: 240240b2f8cc3984236c6cea1f18658ef535a81c
  tool_build_flags: Release;CUDA;GPU-arch captured in session;recipe=compressors/build/cuszp2.sh
  tool_patch_sha256: e0eec4a8fdef5c92f91fde9c4c3df1238ae1d872f2922b8fdc4660feac735c27

x-cuszp3-tool: &cuszp3_tool
  tool_version: 3.0.0
  tool_source_commit: da90afb42770fcef6129cb586cf185c7d54c614c
  tool_build_flags: Release;CUDA;GPU-arch captured in session;recipe=compressors/build/cuszp3.sh
  tool_patch_sha256: c55b20ff1477f0cbf76247da9a879f5d0a94aac6063e17beefd32340ebe633bb

x-fzgpu-tool: &fzgpu_tool
  tool_version: 0.1-3-g
  tool_source_commit: c7e83f7614c8505e9b539190606b11589273696b
  tool_build_flags: Release;CUDA;GPU-arch captured in session;recipe=compressors/build/fz-gpu.sh
  tool_patch_sha256: 5f2d0e9782a0e02cb392ad04e7eaf4b560e2f013c5445096eec7bd0e38dd46b1

x-pfpl-tool: &pfpl_tool
  tool_version: 36f5aaef
  tool_source_commit: 36f5aaef42744ed78b4d1525b03a7fb2168b363c
  tool_build_flags: Release;CUDA;GPU-arch captured in session;recipe=compressors/build/pfpl.sh
  tool_patch_sha256: 9e082a37372f894e6a8af3797cbe72f05412197569edd1a4f54e2f82fe1d70b6

verification:
  accepted_failures:
    - match:
        compressor: fzgm
        variant: pfpl
        dataset: CESM-2D
        field: PSL
        error_bound: 1.0e-4
        error_type: AdapterError
        fail_phase: compress
      reason: >-
        This offset-dominated field puts nearly every value outside PFPL's
        declared quantizer capacity. Commit b08c406 restores the same safe
        refusal under staged and specialized execution; retaining this cell in
        the smoke prevents a recurrence of the prior silent fused-path error.

runs:
  # ── cuSZ (Lorenzo-Quant → Huffman; never specializes) ──────────────────────
  - {<<: *cusz_tool, compressor: cusz, variant: cusz, pipeline: default}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cusz, pipeline: configs/pipelines/cusz.toml}

  # ── cuSZp2 outlier ────────────────────────────────────────────────────────
  - {<<: *cuszp2_tool, compressor: cuszp2, variant: cuszp2_outlier, pipeline: outlier}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp2_outlier_hp, pipeline: configs/pipelines/cuszp2.toml}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp2_outlier_sp, pipeline: configs/pipelines/cuszp2_sp.toml}

  # ── cuSZp2 plain ──────────────────────────────────────────────────────────
  - {<<: *cuszp2_tool, compressor: cuszp2, variant: cuszp2_plain, pipeline: plain}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp2_plain_hp, pipeline: configs/pipelines/cuszp2_plain.toml}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp2_plain_sp, pipeline: configs/pipelines/cuszp2_plain_sp.toml}

  # ── cuSZp3 fixed (no predictor; non-specializing performance control) ──────
  - {<<: *cuszp3_tool, compressor: cuszp3, variant: cuszp3_fixed, pipeline: fixed}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_fixed, pipeline: configs/pipelines/cuszp3_fixed.toml}

  # ── cuSZp3 plain (dimension-matched) ──────────────────────────────────────
  - {<<: *cuszp3_tool, compressor: cuszp3, variant: cuszp3_plain, pipeline: "plain:2d", only_datasets: [CESM-2D]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_plain_hp, pipeline: configs/pipelines/cuszp3.toml, only_datasets: [CESM-2D]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_plain_sp, pipeline: configs/pipelines/cuszp3_plain_sp.toml, only_datasets: [CESM-2D]}
  - {<<: *cuszp3_tool, compressor: cuszp3, variant: cuszp3_plain, pipeline: "plain:3d", only_datasets: [HURR, NYX]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_plain_hp, pipeline: configs/pipelines/cuszp3_3d.toml, only_datasets: [HURR, NYX]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_plain_sp, pipeline: configs/pipelines/cuszp3_3d_plain_sp.toml, only_datasets: [HURR, NYX]}
  - {<<: *cuszp3_tool, compressor: cuszp3, variant: cuszp3_plain, pipeline: plain, only_datasets: [HACC]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_plain_hp, pipeline: configs/pipelines/cuszp3_1d.toml, only_datasets: [HACC]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_plain_sp, pipeline: configs/pipelines/cuszp2_plain_sp.toml, only_datasets: [HACC]}

  # ── cuSZp3 outlier (dimension-matched) ────────────────────────────────────
  - {<<: *cuszp3_tool, compressor: cuszp3, variant: cuszp3_outlier, pipeline: "outlier:2d", only_datasets: [CESM-2D]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_outlier_hp, pipeline: configs/pipelines/cuszp3_outlier.toml, only_datasets: [CESM-2D]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_outlier_sp, pipeline: configs/pipelines/cuszp3_outlier_sp.toml, only_datasets: [CESM-2D]}
  - {<<: *cuszp3_tool, compressor: cuszp3, variant: cuszp3_outlier, pipeline: "outlier:3d", only_datasets: [HURR, NYX]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_outlier_hp, pipeline: configs/pipelines/cuszp3_3d_outlier.toml, only_datasets: [HURR, NYX]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_outlier_sp, pipeline: configs/pipelines/cuszp3_3d_sp.toml, only_datasets: [HURR, NYX]}
  - {<<: *cuszp3_tool, compressor: cuszp3, variant: cuszp3_outlier, pipeline: outlier, only_datasets: [HACC]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_outlier_hp, pipeline: configs/pipelines/cuszp3_1d_outlier.toml, only_datasets: [HACC]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_outlier_sp, pipeline: configs/pipelines/cuszp2_sp.toml, only_datasets: [HACC]}

  # ── FZ-GPU (bitshuffle shape; never specializes) ──────────────────────────
  - {<<: *fzgpu_tool, compressor: fzgpu, variant: fzgpu, pipeline: default}
  - {<<: *fzgm_tool, compressor: fzgm, variant: fzgpu, pipeline: configs/pipelines/fzgpu.toml}

  # ── PFPL (chunk-cooperative specialization; single preset) ────────────────
  - {<<: *pfpl_tool, compressor: pfpl, variant: pfpl, pipeline: default}
  - {<<: *fzgm_tool, compressor: fzgm, variant: pfpl, pipeline: configs/pipelines/pfpl.toml}

  # ── SZp-inspired composition — FZGM-only; not native/byte parity ───────────
  - {<<: *fzgm_tool, compressor: fzgm, variant: szp_composed, pipeline: configs/pipelines/szp_composed.toml}
