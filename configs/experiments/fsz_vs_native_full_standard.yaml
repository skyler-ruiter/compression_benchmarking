# Full-corpus standard-bound native FSZ versus its matching FZGM reconstruction.
#
# CR and quality are the paired comparison: both use range-relative uniform
# quantization, FSZ's adaptive tile predictor, and its fixed-rate block coder.
# Throughput also prices FZGM's modular materialization against native FSZ's
# fused kernel, so it is architectural context rather than predictor isolation.
# Native and FZGM rows both retain matched device and host timing brackets.

name: fsz_vs_native_full_standard
description: >
  Full 13-family SDRBench comparison of native FSZ 1.0.0 against FZGM's
  Quantizer-then-AdaptiveLorenzo-then-AdaptiveBitpack reconstruction at standard
  rel_range bounds. Report device and host timing separately.

fields:
  NWCHEM: [t631]
datasets:
  - CESM-2D
  - CESMATM-3D
  - HURR
  - NYX
  - MIRANDA
  - HACC
  - EXAALT
  - QMCPACK-3D
  - SCALE-LETKF
  - S3D
  - NWCHEM
  - BROWN
  - EXAFEL

error:
  mode: rel_range
  bounds: [1.0e-2, 1.0e-3, 1.0e-4]

repetitions: 5
warmup_reps: 1
lock_clocks: true
retain_decompressed: false
retain_compressed: false

x-fsz-tool: &fsz_tool
  tool_version: 1.0.0
  tool_source_commit: 43240ed1149ff4c48b52e74c9d8ba998ca5bcf8c
  tool_build_flags: Release;CMAKE_CUDA_ARCHITECTURES=90;NVHPC-25.7-CUDA-12.9
  tool_patch_sha256: clean

x-fzgm-tool: &fzgm_tool
  tool_version: 2.0.0-dev
  tool_source_commit: 65299209bee12f7e4518d018050d7602f56808d9
  tool_build_flags: Release;FZGMOD_BACKEND=CUDA;CMAKE_CUDA_ARCHITECTURES=90;NVHPC-25.7-CUDA-12.9
  tool_patch_sha256: af516d1d2c040222098f3e7016e20afe1898226d348612295c7c2518d04ae817

runs:
  - <<: *fsz_tool
    compressor: fsz
    variant: fsz_native
    pipeline: default

  - <<: *fzgm_tool
    compressor: fzgm
    variant: fzgm_fsz_bpt8
    pipeline: configs/pipelines/fsz.toml
