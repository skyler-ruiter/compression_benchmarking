# Fixed-graph staged/Auto crossover study for the warp-register specialization.
# The launcher runs this matrix twice with FZ_SPECIALIZE=off and auto. Runtime
# execution_path telemetry attributes each Auto row to TI/single-pass/two-pass.
name: specialization_size_crossover
description: >
  HACC/vx prefix sweep from 2^10 through 2^28 f32 values for the 1-D Lorenzo
  plus AdaptiveBitpack family. Holds data source and error bound fixed while
  varying input size, block size, and plain/outlier mode to locate staged versus
  specialized crossovers and internal warp-path transitions.

datasets: [HACC-vx-prefixes]
fields:
  HACC-vx-prefixes:
    - n_1024
    - n_4096
    - n_16384
    - n_65536
    - n_262144
    - n_1048576
    - n_4194304
    - n_16777216
    - n_67108864
    - n_268435456

error:
  mode: rel_range
  bounds: [1.0e-3]

repetitions: 10
warmup_reps: 2
lock_clocks: true
retain_decompressed: false
retain_compressed: false

x-fzgm-tool: &fzgm_tool
  tool_version: 2.0.0-dev
  tool_source_commit: b08c406c48631eebdfc2b362e34aa521081f61f0
  tool_build_flags: Release;CUDA;sm_90;runtime-path-telemetry
  tool_patch_sha256: e855de8e71f534c1fa3d7bd799dfc76f826a636dca640167317a4461cb8384c6

runs:
  - {<<: *fzgm_tool, compressor: fzgm, variant: lorenzo_ab_b32_plain, pipeline: configs/pipelines/lorenzo_ab_b32_plain.toml}
  - {<<: *fzgm_tool, compressor: fzgm, variant: lorenzo_ab_b32_outlier, pipeline: configs/pipelines/lorenzo_ab_b32_outlier.toml}
  - {<<: *fzgm_tool, compressor: fzgm, variant: lorenzo_ab_b64_plain, pipeline: configs/pipelines/lorenzo_ab_b64_plain.toml}
  - {<<: *fzgm_tool, compressor: fzgm, variant: lorenzo_ab_b64_outlier, pipeline: configs/pipelines/lorenzo_ab_b64_outlier.toml}
  - {<<: *fzgm_tool, compressor: fzgm, variant: lorenzo_ab_b96_plain, pipeline: configs/pipelines/lorenzo_ab_b96_plain.toml}
  - {<<: *fzgm_tool, compressor: fzgm, variant: lorenzo_ab_b96_outlier, pipeline: configs/pipelines/lorenzo_ab_b96_outlier.toml}
  - {<<: *fzgm_tool, compressor: fzgm, variant: lorenzo_ab_b128_plain, pipeline: configs/pipelines/lorenzo_ab_b128_plain.toml}
  - {<<: *fzgm_tool, compressor: fzgm, variant: lorenzo_ab_b128_outlier, pipeline: configs/pipelines/lorenzo_ab_b128_outlier.toml}
