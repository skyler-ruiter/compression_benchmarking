# Pipeline Specialization vs. native — FULL-CORPUS throughput/CR/memory sweep.
#
# The full-corpus counterpart to specialization_vs_native_smoke.yaml, run AFTER the
# 2026-08/09 optimization work: generalized warp-register fusion (fwd+inverse, any
# block = 32*EPL, plain + outlier), warp-register *decompress* fusion, chunk-
# cooperative decompress fusion, and specialization-aware buffer coloring. The
# smoke (4 shape-class fields) validated the mechanism on 3+ machines with zero CR
# drift off<->auto; this is the paper table, where "we picked one field per
# dataset" is a selection-bias question you do not want to answer.
#
# ---------------------------------------------------------------------------
# HOW TO RUN — two launches of THIS file, distinguished only by environment
# ---------------------------------------------------------------------------
#   FZ_SPECIALIZE=off  python -m benchkit run configs/experiments/specialization_vs_native_full.yaml \
#       --session-id specialization-vs-native-full-<host>-staged-<date>
#   FZ_SPECIALIZE=auto python -m benchkit run configs/experiments/specialization_vs_native_full.yaml \
#       --session-id specialization-vs-native-full-<host>-auto-<date>
#
# FZ_SPECIALIZE overrides the pipeline's finalize-time specialization policy (FZGM
# compressor.cpp planAndInstallFusion): `auto` = specialized (kernel fusion +
# single-pass decoupled-lookback, compress AND decompress), `off` = staged (one
# kernel per stage). It is folded into the session resume identity (benchkit
# runner _FZGM_BEHAVIOR_ENV), so the two sessions never collide. Native rows are
# separate binaries, unaffected by FZ_SPECIALIZE — they re-measure consistently
# across both sessions and are the cross-check.
#
# ---------------------------------------------------------------------------
# THE MATRIX — _sp arms only (per the campaign scope decision, 2026-09-03)
# ---------------------------------------------------------------------------
#   <native>       the reference binary (cusz / cuszp2 / cuszp3 / fzgpu / pfpl)
#   fzgm <v>_sp    the specialization-ready preset: plain linear quant, the same
#                  arithmetic native cuSZp actually does, NO linear_high_precision,
#                  outlier_selection = false for the plain variants. Staged in the
#                  `off` session, fused in the `auto` session. The compressed
#                  payload is byte-identical off vs auto (only an 8-byte FZM header
#                  checksum differs; data_checksum + reconstruction match), so any
#                  CR change between the two sessions is a BUG. The delta between
#                  the two sessions on these rows IS the specialization gain.
#
# The _hp arm (linear_high_precision quant, used for tight-bound CR parity in
# fzgm_vs_native_full.yaml) is NOT included: high-precision quant is gated out of
# fusion, so its auto numbers == its off numbers — nothing to learn at corpus
# scale. cusz / fzgpu keep ONE fzgm row each: they never specialize (Huffman
# entropy stage / FZ-GPU bitshuffle shape), so those are controls — auto MUST
# equal off exactly, and a difference there is a bug in the env plumbing.
#
# Every row captures compress AND decompress throughput, CR, PSNR, eb-satisfaction,
# and peak device memory (decompress_throughput_gbs / peak_device_mb are
# first-class row fields).
#   python -m benchkit report results/<session>/ --aggregate --by-dataset
#
# ---------------------------------------------------------------------------
# Runtime, disk, sharding
# ---------------------------------------------------------------------------
# ~8,240 cells per session (vs. ~9,680 in fzgm_vs_native_full — no cuSZ-Hi, which
# does not specialize). At fzgm_vs_native_full's measured ~27 h/9.68k on the H100
# that is ~23 h per session, so ~46 h for the off+auto pair; longer on A100/H200.
# Shard across nodes/GPUs (never several shards on one GPU — overlapping processes
# contend during the timed kernels, D15):
#
#   FZ_SPECIALIZE=auto python -m benchkit run configs/experiments/specialization_vs_native_full.yaml \
#       --session-id "$SLURM_ARRAY_JOB_ID" --shard "$SLURM_ARRAY_TASK_ID/8"
#
# retain_* are both false — steady-state work/ is logs only; peak transient is one
# compressed + one decompressed artifact (worst case ~2.2 GB on a HACC cell).
#
# ---------------------------------------------------------------------------
# Structural notes (all pre-existing unless flagged)
# ---------------------------------------------------------------------------
#   - cuSZ-Hi is dropped entirely: its spline predictor (GInterpStage) is not a
#     fusable shape, so there is no off<->auto story. Its standalone reference data
#     is in fzgm_vs_native_full.yaml.
#   - cuszp3 is dimension-matched end to end (D17): 2-D 8x8 for CESM-2D, 3-D 4x4x4
#     for every 3-D dataset, block-32 Lorenzo for 1-D (HACC/EXAALT/NWCHEM/BROWN).
#     There is no cuszp3_1d_*_sp preset — the block-32 cuszp2_*_sp chain IS the
#     dimension-matched _sp equivalent for 1-D (identical predictor + coder).
#   - cuszp3 now specializes BOTH directions (096a5ba): the warp inverse
#     reconstructs each tile by the separable prefix sum, then scatters to natural
#     row-major (fused_unpack_tiled_body). 3-D decompress gain is small (~1.05-
#     1.12x) because the 3-D predictor is roofline/compute-bound; 2-D is ~1.35-1.4x.
#   - pfpl specializes via the chunk-cooperative path (single preset).
#   - szp_composed: no native SZp CLI in this repo -> FZGM-only showcase row.
#   - fzgpu is float32-only -> dropped on both sides for the f64 datasets (MIRANDA,
#     S3D, NWCHEM, BROWN), same as fzgm_vs_native_full.yaml.
#   - NEW TERRITORY: the smoke was f32-only. The f64 _sp rows (cuszp2/cuszp3 on
#     MIRANDA/S3D/NWCHEM/BROWN) exercise warp-register fusion on f64 quant codes
#     for the first time. In the `auto` session, spot-check that those rows report
#     fusion_installed_group_count > 0; a silent fallback to staged is a FINDING to
#     report, not a run failure (CR/quality are unaffected either way).
#   - Native eb-bound misses (cusz on tight HACC bounds, native cuszp3_outlier on
#     some CESM-2D / HURR fields) are handled by the validity gate (severe misses
#     excluded automatically) and are IDENTICAL off vs auto — they are not
#     introduced by specialization. Review them in the `benchkit verify` audit
#     rather than pre-declaring the full list; the smoke's 6 were all native.
#   - QMCPACK (4-D) excluded; QMCPACK-3D (split along its slowest axis) used
#     instead. See configs/datasets.yaml.

name: specialization_vs_native_full
description: >
  Full-corpus Pipeline Specialization vs native for cuSZ, cuSZp2 (plain/outlier),
  cuSZp3 (plain/outlier, dim-matched), FZ-GPU and PFPL, plus an FZGM-only
  szp_composed showcase — every field of all 13 usable SDRBench datasets
  (186 fields), eb in {1e-2, 1e-3, 1e-4}, rel_range. Run twice (FZ_SPECIALIZE=off
  then auto). _sp arms only.

# A dataset absent from this mapping falls back to its full field list
# (config.py fields_for). NWCHEM's acd (6.4 GB) / ccd (5.7 GB) fields OOM half the
# fleet (measured 20.6-35.0 GB peak on the H100) — scoped to t631 only, same as
# fzgm_vs_native_full.yaml.
fields:
  NWCHEM: [t631]

datasets:
  - CESM-2D       # 79 fields,  2-D, f32,  25.9 MB/field
  - CESMATM-3D    # 33 fields,  3-D, f32, 673.9 MB/field  <- ~8 h of the total
  - HURR          # 13 fields,  3-D, f32, 100.0 MB/field
  - NYX           #  6 fields,  3-D, f32, 536.9 MB/field
  - MIRANDA       #  7 fields,  3-D, f64, 302.0 MB/field  <- f64
  - HACC          #  6 fields,  1-D, f32, 1123.8 MB/field
  - EXAALT        #  6 fields,  1-D, f32,  11.5 MB/field
  - QMCPACK-3D    #  8 fields,  3-D, f32,   2.2 MB/field  <- split orbitals
  - SCALE-LETKF   # 12 fields,  3-D, f32, 564.5 MB/field
  - S3D           # 11 fields,  3-D, f64, 1000.0 MB/field <- f64
  - NWCHEM        #  1 field*,  1-D, f64, 823.6 MB/field  <- *scoped above
  - BROWN         #  3 fields,  1-D, f64, 268.4 MB/field  <- f64 synthetic
  - EXAFEL        #  1 field,   3-D, f32, 1194.4 MB/field

error:
  mode: rel_range
  bounds: [1.0e-2, 1.0e-3, 1.0e-4]

repetitions: 5
warmup_reps: 1
lock_clocks: true          # JetStream2 VM is single-tenant; run scripts/lock_clocks.sh first.
                           # Inert on SLURM sites (BigRed200/Delta) where clock control is
                           # admin-only — use --exclusive there instead (D15).
retain_decompressed: false
retain_compressed: false   # non-negotiable at this scale — see the disk note above and D25

x-fzgm-tool: &fzgm_tool
  tool_version: 2.0.0-dev
  tool_source_commit: 6897f66e946f7388020c0c84a103428f916ea2a7
  tool_build_flags: Release;FZGMOD_BACKEND=CUDA;CMAKE_CUDA_ARCHITECTURES=90;NVHPC-25.7-CUDA-12.9
  tool_patch_sha256: clean

verification:
  accepted_failures:
    - match:
        compressor: fzgm
        variant: pfpl
        dataset: CESM-2D
        field: PSL
        error_bound: 1.0e-4
        error_type: AdapterError
        fail_phase: compress
      reason: >-
        This offset-dominated field puts 99.9% of values outside PFPL's declared
        10% quantizer outlier capacity. The safe refusal is a measured capability
        boundary (carried over from fusion_standard_full_auto.yaml), identical
        off vs auto, and is excluded from the native pairing.

runs:
  # ── cuSZ (Lorenzo-Quant → Huffman; never specializes — CONTROL) ────────────
  - {compressor: cusz, variant: cusz, pipeline: default}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cusz, pipeline: configs/pipelines/cusz.toml}

  # ── cuSZp2 outlier ────────────────────────────────────────────────────────
  - {compressor: cuszp2, variant: cuszp2_outlier,    pipeline: outlier}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp2_outlier_sp, pipeline: configs/pipelines/cuszp2_sp.toml}

  # ── cuSZp2 plain ──────────────────────────────────────────────────────────
  - {compressor: cuszp2, variant: cuszp2_plain,      pipeline: plain}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp2_plain_sp,   pipeline: configs/pipelines/cuszp2_plain_sp.toml}

  # ── cuSZp3 plain (dimension-matched) ──────────────────────────────────────
  - {compressor: cuszp3, variant: cuszp3_plain,      pipeline: "plain:2d", only_datasets: [CESM-2D]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_plain_sp,   pipeline: configs/pipelines/cuszp3_plain_sp.toml, only_datasets: [CESM-2D]}
  - {compressor: cuszp3, variant: cuszp3_plain,      pipeline: "plain:3d",
     only_datasets: [CESMATM-3D, HURR, NYX, MIRANDA, QMCPACK-3D, SCALE-LETKF, S3D, EXAFEL]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_plain_sp,   pipeline: configs/pipelines/cuszp3_3d_plain_sp.toml,
     only_datasets: [CESMATM-3D, HURR, NYX, MIRANDA, QMCPACK-3D, SCALE-LETKF, S3D, EXAFEL]}
  - {compressor: cuszp3, variant: cuszp3_plain,      pipeline: plain,
     only_datasets: [HACC, EXAALT, NWCHEM, BROWN]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_plain_sp,   pipeline: configs/pipelines/cuszp2_plain_sp.toml,
     only_datasets: [HACC, EXAALT, NWCHEM, BROWN]}

  # ── cuSZp3 outlier (dimension-matched) ────────────────────────────────────
  - {compressor: cuszp3, variant: cuszp3_outlier,    pipeline: "outlier:2d", only_datasets: [CESM-2D]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_outlier_sp, pipeline: configs/pipelines/cuszp3_outlier_sp.toml, only_datasets: [CESM-2D]}
  - {compressor: cuszp3, variant: cuszp3_outlier,    pipeline: "outlier:3d",
     only_datasets: [CESMATM-3D, HURR, NYX, MIRANDA, QMCPACK-3D, SCALE-LETKF, S3D, EXAFEL]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_outlier_sp, pipeline: configs/pipelines/cuszp3_3d_sp.toml,
     only_datasets: [CESMATM-3D, HURR, NYX, MIRANDA, QMCPACK-3D, SCALE-LETKF, S3D, EXAFEL]}
  - {compressor: cuszp3, variant: cuszp3_outlier,    pipeline: outlier,
     only_datasets: [HACC, EXAALT, NWCHEM, BROWN]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszp3_outlier_sp, pipeline: configs/pipelines/cuszp2_sp.toml,
     only_datasets: [HACC, EXAALT, NWCHEM, BROWN]}

  # ── FZ-GPU (bitshuffle shape; never specializes — CONTROL; f32 only) ───────
  - {compressor: fzgpu, variant: fzgpu, pipeline: default,
     skip_datasets: [MIRANDA, S3D, NWCHEM, BROWN]}
  - {<<: *fzgm_tool, compressor: fzgm, variant: fzgpu, pipeline: configs/pipelines/fzgpu.toml,
     skip_datasets: [MIRANDA, S3D, NWCHEM, BROWN]}

  # ── PFPL (chunk-cooperative specialization; single preset) ────────────────
  - {compressor: pfpl, variant: pfpl, pipeline: default}
  - {<<: *fzgm_tool, compressor: fzgm, variant: pfpl, pipeline: configs/pipelines/pfpl.toml}

  # ── SZp composed — FZGM-only showcase (no native SZp CLI in this repo) ─────
  - {<<: *fzgm_tool, compressor: fzgm, variant: szp_composed, pipeline: configs/pipelines/szp_composed.toml}
