# Full-corpus rerun of the cuSZp-family linear quantizers after strict
# double-coordinate/reconstruction arithmetic. Every standard arm uses double;
# cuSZp2 outlier is repeated with the separately-labelled power-of-two policy.

name: tight_bounds_quantizer_precision_full
description: Full-corpus strict-double cuSZp2/cuSZp3 sweep plus a cuSZp2 power2 feature arm.

fields:
  NWCHEM: [t631]
datasets:
  - CESM-2D
  - CESMATM-3D
  - HURR
  - NYX
  - MIRANDA
  - HACC
  - EXAALT
  - QMCPACK-3D
  - SCALE-LETKF
  - S3D
  - NWCHEM
  - BROWN
  - EXAFEL

error:
  mode: rel_range
  bounds: [1.0e-6, 1.0e-7]

repetitions: 5
warmup_reps: 1
lock_clocks: true
retain_decompressed: false
retain_compressed: false

x-tool: &fzgm_tool
  tool_version: 2.0.0-dev
  tool_source_commit: 65299209bee12f7e4518d018050d7602f56808d9
  tool_build_flags: Release;FZGMOD_BACKEND=CUDA;CMAKE_CUDA_ARCHITECTURES=90;NVHPC-25.7-CUDA-12.9
  tool_patch_sha256: af516d1d2c040222098f3e7016e20afe1898226d348612295c7c2518d04ae817

runs:
  - <<: *fzgm_tool
    compressor: fzgm
    variant: cuszp2_outlier_double
    pipeline: configs/pipelines/cuszp2.toml

  - <<: *fzgm_tool
    compressor: fzgm
    variant: cuszp2_plain_double
    pipeline: configs/pipelines/cuszp2_plain.toml

  - <<: *fzgm_tool
    compressor: fzgm
    variant: cuszp3_plain_double
    pipeline: configs/pipelines/cuszp3.toml
    only_datasets: [CESM-2D]

  - <<: *fzgm_tool
    compressor: fzgm
    variant: cuszp3_plain_double
    pipeline: configs/pipelines/cuszp3_3d.toml
    only_datasets: [CESMATM-3D, HURR, NYX, MIRANDA, QMCPACK-3D, SCALE-LETKF, S3D, EXAFEL]

  - <<: *fzgm_tool
    compressor: fzgm
    variant: cuszp3_plain_double
    pipeline: configs/pipelines/cuszp3_1d.toml
    only_datasets: [HACC, EXAALT, NWCHEM, BROWN]

  - <<: *fzgm_tool
    compressor: fzgm
    variant: cuszp3_outlier_double
    pipeline: configs/pipelines/cuszp3_outlier.toml
    only_datasets: [CESM-2D]

  - <<: *fzgm_tool
    compressor: fzgm
    variant: cuszp3_outlier_double
    pipeline: configs/pipelines/cuszp3_3d_outlier.toml
    only_datasets: [CESMATM-3D, HURR, NYX, MIRANDA, QMCPACK-3D, SCALE-LETKF, S3D, EXAFEL]

  - <<: *fzgm_tool
    compressor: fzgm
    variant: cuszp3_outlier_double
    pipeline: configs/pipelines/cuszp3_1d_outlier.toml
    only_datasets: [HACC, EXAALT, NWCHEM, BROWN]

  # Feature arm: same cuSZp2 outlier pipeline, but the resolved absolute bound
  # is rounded down to a power of two and must not be treated as rate-equivalent.
  - <<: *fzgm_tool
    compressor: fzgm
    variant: cuszp2_outlier_double_power2
    pipeline: configs/pipelines/cuszp2_power2.toml
