# Paired f32/f64 gate run automatically before fsz_vs_native_full_standard.yaml.
name: fsz_vs_native_standard_smoke
description: Native/FZGM FSZ standard-bound gate on one f32 and one f64 field.

datasets: [CESM-2D, MIRANDA]
fields:
  CESM-2D: [CLDHGH]
  MIRANDA: [density]
error: {mode: rel_range, bounds: [1.0e-3]}
repetitions: 5
warmup_reps: 1
lock_clocks: true
retain_decompressed: false
retain_compressed: false

x-fsz-tool: &fsz_tool
  tool_version: 1.0.0
  tool_source_commit: 43240ed1149ff4c48b52e74c9d8ba998ca5bcf8c
  tool_build_flags: Release;CMAKE_CUDA_ARCHITECTURES=90;NVHPC-25.7-CUDA-12.9
  tool_patch_sha256: clean
x-fzgm-tool: &fzgm_tool
  tool_version: 2.0.0-dev
  tool_source_commit: 65299209bee12f7e4518d018050d7602f56808d9
  tool_build_flags: Release;FZGMOD_BACKEND=CUDA;CMAKE_CUDA_ARCHITECTURES=90;NVHPC-25.7-CUDA-12.9
  tool_patch_sha256: af516d1d2c040222098f3e7016e20afe1898226d348612295c7c2518d04ae817

runs:
  - <<: *fsz_tool
    compressor: fsz
    variant: fsz_native
    pipeline: default
  - <<: *fzgm_tool
    compressor: fzgm
    variant: fzgm_fsz_bpt8
    pipeline: configs/pipelines/fsz.toml
