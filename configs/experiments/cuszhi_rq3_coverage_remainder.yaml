# Exact continuation of the interrupted coverage run.  The original session's
# execution identity changed when unrelated benchmark documentation changed, so
# resuming it would rerun all 150 cells.  This small session measures only its
# unfinished cuSZ-Hi CR cells (QC is repeated as a whole field by the config
# grammar) and is merged as a later native source during RQ3 analysis.
name: cuszhi_rq3_coverage_remainder
description: >
  Remaining native cuSZ-Hi cr coverage on SCALE-LETKF after the interrupted
  2026-09-07 coverage session, using corrected fresh CLI context per repeat.

datasets: [SCALE-LETKF]
fields:
  SCALE-LETKF: [QC, QG, QI, QR, QS, QV, RH, T, U, V, W]

error:
  mode: rel_range
  bounds: [1.0e-2, 1.0e-3, 1.0e-4]

repetitions: 5
warmup_reps: 1
lock_clocks: true
retain_decompressed: false
retain_compressed: false

runs:
  - {compressor: cuszhi, variant: cuszhi_cr, pipeline: cr, tool_version: "cuSZ-Hi-e16b75-repeatfix",
     tool_source_commit: e16b75b63369ef3676742c34ea0d71451b6626a0,
     tool_build_flags: "Release;PSZ_BACKEND=cuda;CMAKE_CUDA_ARCHITECTURES=90;NVHPC-25.7-CUDA-12.9",
     tool_patch_sha256: b5ae3fae61f0a9f89c91675c08248c2efb2e86faee7faad0e37d49fc1e4b4cb8}
