name: cuszhi_tp_performance
description: >-
  Publication-timed H100 comparison of native cuSZ-Hi TP and the corresponding
  FZGM GInterp pipeline on matched 3-D geometry. HURR and SCALE-LETKF are used;
  CESM-2D is excluded because FZGM intentionally corrects the native 2-D anchor
  geometry, so its timing would not compare the same predictor.

datasets: [HURR, SCALE-LETKF]

error:
  mode: rel_range
  bounds: [1.0e-2, 1.0e-3, 1.0e-4]

repetitions: 6
warmup_reps: 1
lock_clocks: true
retain_decompressed: false
retain_compressed: false

x-fzgm-tool: &fzgm_tool
  tool_version: 2.0.0-dev
  tool_source_commit: df7d675e66f56770a9f161e40c3f6a8c32c1c901
  tool_build_flags: Release;CUDA;sm_90;clean source;FZ_SPECIALIZE=off
  tool_patch_sha256: clean

x-cuszhi-tool: &cuszhi_tool
  tool_version: cuSZ-Hi-e16b75-repeatfix
  tool_source_commit: e16b75b63369ef3676742c34ea0d71451b6626a0
  tool_build_flags: >-
    Release;PSZ_BACKEND=cuda;CMAKE_CUDA_ARCHITECTURES=90;
    NVHPC-25.7-CUDA-12.9;in-process-repeat
  tool_patch_sha256: b5ae3fae61f0a9f89c91675c08248c2efb2e86faee7faad0e37d49fc1e4b4cb8

runs:
  - {<<: *cuszhi_tool, compressor: cuszhi, variant: cuszhi_tp, pipeline: tp}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszhi_tp_b1,
     pipeline: configs/pipelines/cusz_hi_tp_b1.toml}

verification:
  accepted_exclusions:
    - codes: [degenerate_field]
      match: {dataset: HURR}
      reason: Constant or degenerate fields cannot support a throughput ratio.
    - codes: [degenerate_field]
      match: {dataset: SCALE-LETKF}
      reason: Constant or degenerate fields cannot support a throughput ratio.
  accepted_unreliable_timing:
    - match: {compressor: cuszhi}
      reason: Timing-unreliable cells are excluded from the performance aggregate.
    - match: {compressor: fzgm}
      reason: Timing-unreliable cells are excluded from the performance aggregate.
