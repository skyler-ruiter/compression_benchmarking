# Generated from configs/experiments/specialization_vs_native_full.yaml for the ipdps27-submission correctness rerun.
# Run both arms: FZ_SPECIALIZE=off|auto, FZGMOD_CLI=<tag build>. Timing is NOT publication data.
name: specialization_vs_native_full_correctness_ipdps27
description: 'Correctness-only rerun of specialization_vs_native_full.yaml at the ipdps27-submission tag
  (a062d88): FZGM rows only, 1 repetition, no warm-up. Compare compressed size, reconstruction hash and
  bound against the published sessions; timing is not used.'
fields:
  NWCHEM:
  - t631
datasets:
- CESM-2D
- CESMATM-3D
- HURR
- NYX
- MIRANDA
- HACC
- EXAALT
- QMCPACK-3D
- SCALE-LETKF
- S3D
- NWCHEM
- BROWN
- EXAFEL
error:
  mode: rel_range
  bounds:
  - 0.01
  - 0.001
  - 0.0001
repetitions: 1
warmup_reps: 0
lock_clocks: false
retain_decompressed: false
retain_compressed: false
verification:
  accepted_failures:
  - match:
      compressor: fzgm
      variant: pfpl
      dataset: CESM-2D
      field: PSL
      error_bound: 0.0001
      error_type: AdapterError
      fail_phase: compress
    reason: This offset-dominated field puts 99.9% of values outside PFPL's declared 10% quantizer outlier
      capacity. The safe refusal is a measured capability boundary (carried over from fusion_standard_full_auto.yaml),
      identical off vs auto, and is excluded from the native pairing.
  - match:
      compressor: fzgm
      variant: pfpl
      dataset: S3D
      error_type: AdapterError
      fail_phase: compress
    reason: The offset-dominated N2 and PRES fields put essentially every value outside PFPL's declared
      10% quantizer outlier capacity at all three bounds. The safe refusal occurs in both arms and these
      cells are excluded from native pairing.
  - match:
      compressor: fzgm
      variant: cusz
      dataset: EXAALT
      error_bound: 0.0001
      error_type: AdapterError
      fail_phase: compress
    reason: Four EXAALT fields require 26--47% outlier storage at the tightest bound, exceeding this preset's
      declared 20% capacity. FZGM refuses rather than drop values and violate the bound; the same cells
      fail in both arms and are unpaired.
  - match:
      compressor: fzgm
      variant: fzgpu
      dataset: EXAALT
      error_bound: 0.0001
      error_type: AdapterError
      fail_phase: compress
    reason: Four EXAALT fields require 26--47% outlier storage at the tightest bound, exceeding this preset's
      declared 20% capacity. FZGM refuses rather than drop values and violate the bound; the same cells
      fail in both arms and are unpaired.
  - match:
      compressor: cusz
      variant: cusz
      dataset: EXAALT
      error_bound: 0.001
      error_type: AdapterError
      fail_phase: compress
    reason: Native cuSZ exits with SIGSEGV for four EXAALT fields at this bound in both arms. The tool
      emits no diagnostic; these native failures are reported as a capability boundary and the affected
      cells are excluded from paired analysis.
  - match:
      compressor: fsz
      variant: fsz
      dataset: CESM-2D
      error_type: AdapterError
      fail_phase: compress
    reason: Native FSZ explicitly rejects the constant SFCLDICE and SFCLDLIQ fields because a range-relative
      bound is undefined. These cells are marked degenerate and are excluded from paired analysis.
  accepted_exclusions:
  - codes:
    - degenerate_field
    match:
      dataset: CESM-2D
    reason: SFCLDICE and SFCLDLIQ are constant in the locked corpus. Their range-relative error bound
      and PSNR are undefined, so all compressor rows for these fields are excluded from quality and performance
      aggregates.
  - codes:
    - eb_violated_severe
    match:
      compressor: cusz
      variant: cusz
    reason: Native cuSZ exceeds the requested pointwise error bound on 12 successful cells. The violations
      are retained as compatibility evidence and excluded from every quality-qualified performance comparison.
  - codes:
    - eb_violated_severe
    match:
      compressor: cuszp3
      variant: cuszp3_plain
    reason: Native cuSZp3 plain mode exceeds the requested pointwise error bound on 29 successful cells.
      These rows are retained for diagnosis and excluded from every quality-qualified performance comparison.
  - codes:
    - eb_violated_severe
    match:
      compressor: cuszp3
      variant: cuszp3_outlier
    reason: Native cuSZp3 outlier mode exceeds the requested pointwise error bound on 115 successful cells.
      These rows are retained for diagnosis and excluded from every quality-qualified performance comparison.
  - codes:
    - eb_violated_severe
    match:
      compressor: fzgpu
      variant: fzgpu
    reason: Native FZ-GPU exceeds the requested pointwise error bound on 84 successful cells. These rows
      are retained for diagnosis and excluded from every quality-qualified performance comparison.
  accepted_unreliable_timing:
  - match:
      compressor: cusz
      variant: cusz
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: cuszp2
      variant: cuszp2_outlier
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: fsz
      variant: fsz
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: fzgm
      variant: cusz
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: fzgm
      variant: cuszp2_outlier_sp
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: fzgm
      variant: cuszp2_plain_sp
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: fzgm
      variant: cuszp3_fixed
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: fzgm
      variant: cuszp3_outlier_sp
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: fzgm
      variant: cuszp3_plain_sp
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: fzgm
      variant: fsz
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: fzgm
      variant: fzgpu
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: fzgm
      variant: pfpl
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: fzgm
      variant: szp_composed
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: fzgpu
      variant: fzgpu
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: pfpl
      variant: pfpl
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
