# Subset of cuszp3_fixed_dimmatched_full.yaml; see description.
name: cuszp3_fixed_dimmatched_1d_completion
description: Completion of the off arm of cuszp3_fixed_dimmatched_full (session cuszp3-fixed-dimmatched-skyler-h100-off-20260928),
  which was paused partway through HACC. Resume could not skip completed cells because the execution identity
  hashes the shared working tree, which a concurrent session changed (PFPL/peak-memory files, unrelated
  to these cells). This config reruns only the 1-D rows (HACC, EXAALT, NWCHEM, BROWN) into the same session;
  `benchkit merge` then keeps one row per logical cell (newest wins). Identical runs, corpus, bounds,
  repetitions, and FZGM build as the full experiment.
fields:
  NWCHEM:
  - t631
datasets:
- HACC
- EXAALT
- NWCHEM
- BROWN
error:
  mode: rel_range
  bounds:
  - 0.01
  - 0.001
  - 0.0001
repetitions: 5
warmup_reps: 1
lock_clocks: true
retain_decompressed: false
retain_compressed: false
verification:
  accepted_exclusions:
  - codes:
    - degenerate_field
    match:
      dataset: CESM-2D
    reason: SFCLDICE and SFCLDLIQ are constant in the locked corpus. Their range-relative error bound
      and PSNR are undefined, so all compressor rows for these fields are excluded from quality and performance
      aggregates.
  - codes:
    - eb_violated_severe
    match:
      compressor: cuszp3
      variant: cuszp3_fixed
    reason: Native cuSZp3 fixed:2d/fixed:3d produce severe pointwise bound violations on some fields (observed
      in b1_cuszp3_fixed_final). They are retained as native-behavior evidence and excluded from quality-qualified
      comparisons.
  accepted_unreliable_timing:
  - match:
      compressor: fzgm
      variant: cuszp3_fixed
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: cuszp3
      variant: cuszp3_fixed
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
runs:
- tool_version: 3.0.0
  tool_source_commit: da90afb42770fcef6129cb586cf185c7d54c614c
  tool_build_flags: Release;CUDA;GPU-arch captured in session;recipe=compressors/build/cuszp3.sh
  tool_patch_sha256: c55b20ff1477f0cbf76247da9a879f5d0a94aac6063e17beefd32340ebe633bb
  compressor: cuszp3
  variant: cuszp3_fixed
  pipeline: fixed
  only_datasets: &id001
  - HACC
  - EXAALT
  - NWCHEM
  - BROWN
- tool_version: 2.0.0-dev
  tool_source_commit: d511ebcb447194dd90cc452ce073dffc9ee78403
  tool_build_flags: Release;CUDA;sm_90;clean worktree ~/FZGPUModules-d511ebc-cuszp3fixed
  tool_patch_sha256: clean
  compressor: fzgm
  variant: cuszp3_fixed
  pipeline: configs/pipelines/cuszp3_fixed.toml
  only_datasets: *id001
