  tool_build_flags: Release;CUDA;GPU-arch captured in session;recipe=compressors/build/cuszp3.sh
  tool_patch_sha256: c55b20ff1477f0cbf76247da9a879f5d0a94aac6063e17beefd32340ebe633bb
  compressor: cuszp3
  variant: cuszp3_fixed
