# Generated from specialization_vs_native_full.yaml (header + cuSZp3-fixed-relevant policy);
# see description. Launch: scripts/run-cuszp3-fixed-dimmatched.sh
name: cuszp3_fixed_dimmatched_full
description: Full-corpus replacement for the cuSZp3 fixed rows of specialization_vs_native_full. That
  campaign invoked native `fixed` without a dimension suffix (1-D) on every dataset while FZGM used 8x8
  / 4x4x4 tiles on 2-D/3-D data, and its FZGM 1-D preset used 64-element blocks where native uses 32.
  Here native runs fixed:2d / fixed:3d / fixed (1-D) matched to the field, and the 1-D preset uses 32-element
  blocks. Same corpus, bounds, repetitions, and FZGM revision (d511ebc) as the main campaign; run twice
  (FZ_SPECIALIZE=off then auto) with FZGMOD_CLI pointing at the clean d511ebc worktree build.
fields:
  NWCHEM:
  - t631
datasets:
- CESM-2D
- CESMATM-3D
- HURR
- NYX
- MIRANDA
- HACC
- EXAALT
- QMCPACK-3D
- SCALE-LETKF
- S3D
- NWCHEM
- BROWN
- EXAFEL
error:
  mode: rel_range
  bounds:
  - 0.01
  - 0.001
  - 0.0001
repetitions: 5
warmup_reps: 1
lock_clocks: true
retain_decompressed: false
retain_compressed: false
verification:
  accepted_exclusions:
  - codes:
    - degenerate_field
    match:
      dataset: CESM-2D
    reason: SFCLDICE and SFCLDLIQ are constant in the locked corpus. Their range-relative error bound
      and PSNR are undefined, so all compressor rows for these fields are excluded from quality and performance
      aggregates.
  - codes:
    - eb_violated_severe
    match:
      compressor: cuszp3
      variant: cuszp3_fixed
    reason: Native cuSZp3 fixed:2d/fixed:3d produce severe pointwise bound violations on some fields (observed
      in b1_cuszp3_fixed_final). They are retained as native-behavior evidence and excluded from quality-qualified
      comparisons.
  accepted_unreliable_timing:
  - match:
      compressor: fzgm
      variant: cuszp3_fixed
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
  - match:
      compressor: cuszp3
      variant: cuszp3_fixed
    reason: Rows marked unreliable by Benchkit's repetition-variance gate are retained for quality evidence
      but excluded from all throughput and speedup aggregates.
runs:
- tool_version: 3.0.0
  tool_source_commit: da90afb42770fcef6129cb586cf185c7d54c614c
  tool_build_flags: Release;CUDA;GPU-arch captured in session;recipe=compressors/build/cuszp3.sh
  tool_patch_sha256: c55b20ff1477f0cbf76247da9a879f5d0a94aac6063e17beefd32340ebe633bb
  compressor: cuszp3
  variant: cuszp3_fixed
  pipeline: fixed:2d
  only_datasets:
  - CESM-2D
- tool_version: 2.0.0-dev
  tool_source_commit: d511ebcb447194dd90cc452ce073dffc9ee78403
  tool_build_flags: Release;CUDA;sm_90;clean worktree ~/FZGPUModules-d511ebc-cuszp3fixed
  tool_patch_sha256: clean
  compressor: fzgm
  variant: cuszp3_fixed
  pipeline: configs/pipelines/cuszp3_2d_fixed.toml
  only_datasets:
  - CESM-2D
- tool_version: 3.0.0
  tool_source_commit: da90afb42770fcef6129cb586cf185c7d54c614c
  tool_build_flags: Release;CUDA;GPU-arch captured in session;recipe=compressors/build/cuszp3.sh
  tool_patch_sha256: c55b20ff1477f0cbf76247da9a879f5d0a94aac6063e17beefd32340ebe633bb
  compressor: cuszp3
  variant: cuszp3_fixed
  pipeline: fixed:3d
  only_datasets: &id001
  - CESMATM-3D
  - HURR
  - NYX
  - MIRANDA
  - QMCPACK-3D
  - SCALE-LETKF
  - S3D
  - EXAFEL
- tool_version: 2.0.0-dev
  tool_source_commit: d511ebcb447194dd90cc452ce073dffc9ee78403
  tool_build_flags: Release;CUDA;sm_90;clean worktree ~/FZGPUModules-d511ebc-cuszp3fixed
  tool_patch_sha256: clean
  compressor: fzgm
  variant: cuszp3_fixed
  pipeline: configs/pipelines/cuszp3_3d_fixed.toml
  only_datasets: *id001
- tool_version: 3.0.0
