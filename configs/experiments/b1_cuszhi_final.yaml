name: b1_cuszhi_final
description: >-
  Paired H100 compressed-size and reconstruction-quality study of native
  cuSZ-Hi CR/TP and the corresponding FZGM GInterp pipelines. Native and FZGM
  both use CR-first structural autotuning. Results are analyzed separately for
  2-D and 3-D because FZGM intentionally changes the defective native 2-D
  anchor geometry and patches a 2-D autotuning output-slot collision.

datasets: [CESM-2D, HURR, SCALE-LETKF]

error:
  mode: rel_range
  bounds: [1.0e-2, 1.0e-3, 1.0e-4]

repetitions: 3
warmup_reps: 1
lock_clocks: true
retain_decompressed: false
retain_compressed: false

x-fzgm-tool: &fzgm_tool
  tool_version: 2.0.0-dev
  tool_source_commit: d511ebcb447194dd90cc452ce073dffc9ee78403
  tool_build_flags: Release;CUDA;sm_90;clean source;FZ_SPECIALIZE=off
  tool_patch_sha256: clean

x-cuszhi-tool: &cuszhi_tool
  tool_version: cuSZ-Hi-e16b75-repeatfix
  tool_source_commit: e16b75b63369ef3676742c34ea0d71451b6626a0
  tool_build_flags: Release;PSZ_BACKEND=cuda;CMAKE_CUDA_ARCHITECTURES=90;NVHPC-25.7-CUDA-12.9;fresh-context-per-repeat
  tool_patch_sha256: b5ae3fae61f0a9f89c91675c08248c2efb2e86faee7faad0e37d49fc1e4b4cb8

runs:
  - {<<: *cuszhi_tool, compressor: cuszhi, variant: cuszhi_cr, pipeline: cr}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszhi_cr_b1,
     pipeline: configs/pipelines/cusz_hi_cr_b1.toml}
  - {<<: *cuszhi_tool, compressor: cuszhi, variant: cuszhi_tp, pipeline: tp}
  - {<<: *fzgm_tool, compressor: fzgm, variant: cuszhi_tp_b1,
     pipeline: configs/pipelines/cusz_hi_tp_b1.toml}

verification:
  accepted_exclusions:
    - codes: [degenerate_field]
      match: {dataset: CESM-2D}
      reason: >-
        Constant or numerically degenerate CESM fields are retained in the
        matrix but cannot support rate-distortion comparison.
    - codes: [degenerate_field]
      match: {dataset: HURR}
      reason: >-
        Constant or numerically degenerate HURR fields are retained in the
        matrix but cannot support rate-distortion comparison.
    - codes: [degenerate_field]
      match: {dataset: SCALE-LETKF}
      reason: >-
        Constant or numerically degenerate SCALE-LETKF fields are retained in
        the matrix but cannot support rate-distortion comparison.
  accepted_unreliable_timing:
    - match: {compressor: cuszhi}
      reason: >-
        This experiment supports compressed-size and quality claims only;
        timing is retained diagnostically and is not used by the table.
    - match: {compressor: fzgm, variant: cuszhi_cr_b1}
      reason: >-
        This experiment supports compressed-size and quality claims only;
        timing is retained diagnostically and is not used by the table.
    - match: {compressor: fzgm, variant: cuszhi_tp_b1}
      reason: >-
        This experiment supports compressed-size and quality claims only;
        timing is retained diagnostically and is not used by the table.
