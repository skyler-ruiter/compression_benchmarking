name: b1_cuszhi_cr_singlecall
description: FZGM CR arm for B1 size and quality, using one benchmark call per fresh
  process because repeated reuse of the current RRE/RZE graph is not safe. Timing
  is diagnostic and excluded.
datasets:
- CESM-2D
- HURR
- SCALE-LETKF
error:
  mode: rel_range
  bounds:
  - 0.01
  - 0.001
  - 0.0001
repetitions: 1
warmup_reps: 0
lock_clocks: true
retain_decompressed: false
retain_compressed: false
runs:
- compressor: fzgm
  variant: cuszhi_cr_b1_singlecall
  pipeline: configs/pipelines/cusz_hi_cr_b1.toml
  tool_version: 2.0.0-dev
  tool_source_commit: d511ebcb447194dd90cc452ce073dffc9ee78403
  tool_build_flags: Release;CUDA;sm_90;clean source;FZ_SPECIALIZE=off;one call per
    process
  tool_patch_sha256: clean
verification:
  accepted_exclusions:
  - codes:
    - degenerate_field
    match:
      dataset: CESM-2D
    reason: Constant or degenerate fields cannot support rate-distortion comparison.
  - codes:
    - degenerate_field
    match:
      dataset: HURR
    reason: Constant or degenerate fields cannot support rate-distortion comparison.
  - codes:
    - degenerate_field
    match:
      dataset: SCALE-LETKF
    reason: Constant or degenerate fields cannot support rate-distortion comparison.
  accepted_unreliable_timing:
  - match:
      compressor: fzgm
    reason: This experiment supports compressed-size and quality claims only.
