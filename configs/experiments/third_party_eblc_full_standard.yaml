# Standalone third-party EBLC references over the general scientific corpus.
#
# This is deliberately separate from tight_bounds_full_references.yaml: these
# standard bounds characterize useful rate-distortion behavior, while 1e-6/1e-7
# is a failure/precision stress campaign. CPU, GPU, and mixed-wrapper timing must
# remain stratified in every report.

name: third_party_eblc_full_standard
description: >
  Full 13-family scientific-corpus standalone references at rel_range 1e-2,
  1e-3, and 1e-4: SZ3, zfp, MGARD-X, SPERR, MANS, and lsCOMP.

fields:
  NWCHEM: [t631]
datasets:
  - CESM-2D
  - CESMATM-3D
  - HURR
  - NYX
  - MIRANDA
  - HACC
  - EXAALT
  - QMCPACK-3D
  - SCALE-LETKF
  - S3D
  - NWCHEM
  - BROWN
  - EXAFEL

error:
  mode: rel_range
  bounds: [1.0e-2, 1.0e-3, 1.0e-4]

repetitions: 3
warmup_reps: 1
lock_clocks: true
retain_decompressed: false
retain_compressed: false

x-sz3-tool: &sz3_tool
  tool_version: 3.3.2
  tool_source_commit: e08c0ba830dc192d45d19c223dbf5de712a76629
  tool_build_flags: Release;CPU;GNU-CXX
  tool_patch_sha256: clean

x-zfp-tool: &zfp_tool
  tool_version: 1.0.1
  tool_source_commit: 5bf9376f3a91d68596e7537e17deec36523a12bc
  tool_build_flags: Release;ZFP_WITH_CUDA=ON;adapter-execution=serial-CPU
  tool_patch_sha256: clean

x-mgard-tool: &mgard_tool
  tool_version: 1.6.0-dev
  tool_source_commit: b40d1a7392f422fe3b01bdf7e860263cd82d8908
  tool_build_flags: Release;MGARD_ENABLE_CUDA=ON;CMAKE_CUDA_ARCHITECTURES=90
  tool_patch_sha256: clean

x-sperr-tool: &sperr_tool
  tool_version: 0.8.5-dev
  tool_source_commit: b8012586908aaabba993038d183b3937c8ea9c7c
  tool_build_flags: Release;CPU-OpenMP
  tool_patch_sha256: clean

x-mans-tool: &mans_tool
  tool_version: sc-ae-plus-21
  tool_source_commit: 7e9265f0d90027a7f4ea399feceba376d58b0b24
  tool_build_flags: CPU-backend;1D-flattened;benchkit-quarter-bound-quantizer
  tool_patch_sha256: 3e25743272ac445b319c1f84112280c6ff0b6a74ffb96afec28e6c8bccb3243b

x-lscomp-tool: &lscomp_tool
  tool_version: d920dd9-benchkit
  tool_source_commit: d920dd9dc8ddbd2684c777d1e2ba27397212e59c
  tool_build_flags: Release;CMAKE_CUDA_ARCHITECTURES=90;benchkit-quarter-bound-quantizer
  tool_patch_sha256: a76a074f4ee69fefa7f90d682c6b3ad5eb8d43ef771d2d0c2f0718702ab86ba5

runs:
  - <<: *sz3_tool
    compressor: sz3
    variant: sz3-reference
    pipeline: default

  - <<: *zfp_tool
    compressor: zfp
    variant: zfp-quality-reference
    pipeline: default

  # MGARD-X's large 1-D HACC path exhausts even the H100's 80 GB.
  - <<: *mgard_tool
    compressor: mgard
    variant: mgard-quality-reference
    pipeline: default
    skip_datasets: [HACC]

  # SPERR provides only 2-D and 3-D reference tools.
  - <<: *sperr_tool
    compressor: sperr
    variant: sperr-quality-reference
    pipeline: default
    skip_datasets: [HACC, EXAALT, NWCHEM, BROWN]

  # MANS and lsCOMP are lossless integer codecs behind the same documented
  # conservative uniform float quantizer. Wrapper/container bytes count in CR.
  - <<: *mans_tool
    compressor: mans
    variant: mans-quantized-reference
    pipeline: default

  - <<: *lscomp_tool
    compressor: lscomp
    variant: lscomp-quantized-reference
    pipeline: default

# nvCOMP is intentionally absent: it is lossless and belongs in NVC-CORPUS.
