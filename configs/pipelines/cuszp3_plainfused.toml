[pipeline]
# Fusion-compatible cuSZp3 plain mode, 2-D. AdaptiveBitpack's outlier archive
# format arms the warp runner, while PlainBitpackCoder emits only plain blocks.
memory_strategy = "PREALLOCATE"

[[stage]]
name = "quant"
type = "Quantizer"
input_type = "float32"
code_type = "uint32"
error_bound = 1e-3
error_bound_mode = "ABS"
linear_mode = true

[[stage]]
name = "tl"
type = "TiledLorenzo"
data_type = "int32"
tile_x = 8
tile_y = 8
tile_z = 1
inputs = [{from = "quant", port = "codes"}]

[[stage]]
name = "ab"
type = "AdaptiveBitpack"
input_type = "int32"
block_size = 64
outlier_selection = true
fused_coder = "PlainBitpackCoder"
inputs = [{from = "tl"}]
