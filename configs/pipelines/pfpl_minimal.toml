[pipeline]
# PFPL — Quantizer → Difference → Bitshuffle → RZE  (MINIMAL memory strategy)
#
# Same topology as pfpl.toml but with memory_strategy = "MINIMAL".
# PFPL uses uint32 codes (4 bytes/element), so its intermediate buffers are
# larger than FZ-GPU's uint16 buffers. In-place escapes add no side stream, but
# the input, code/difference/bitshuffle buffers, and RZE output can still make
# very large fields unsuitable for a 40 GB device.
memory_strategy = "MINIMAL"

[[stage]]
name = "quant"
type = "Quantizer"
input_type = "float32"
code_type = "uint32"
error_bound = 1e-4
error_bound_mode = "NOA"
quant_radius = 4194304
outlier_capacity = 0.1
zigzag_codes = true
inplace_outliers = true
verify_reconstruction = true

[[stage]]
name = "diff"
type = "Difference"
input_type = "int32"
output_type = "uint32"
chunk_size = 16384
inputs = [{from = "quant", port = "codes"}]

[[stage]]
name = "bshuf"
type = "Bitshuffle"
element_width = 4
block_size = 16384
inputs = [{from = "diff", port = "output"}]

[[stage]]
name = "rze"
type = "RZE"
word_size = 1
inputs = [{from = "bshuf", port = "output"}]
