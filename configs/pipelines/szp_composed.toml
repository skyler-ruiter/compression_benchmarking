[pipeline]
# SZp / fZ-light-inspired modular composition.
#   Quantizer(linear) -> Lorenzo(block_size=128) -> AdaptiveBitpack(block_size=128)
#
# This matches SZp's published high-level quantize -> 1-D Lorenzo -> sign-bit /
# fixed-width packing structure, with no entropy coder. It is not exact upstream
# behavior: CPU SZp truncates x/eb, stores a seed per OpenMP partition, and carries
# prediction across its small-block boundaries. FZGM uses its generic
# round(x/(2eb)) quantizer and resets Lorenzo per 128-value block.
#
# Under FZ_SPECIALIZE=auto the whole chain fuses into one warp-register kernel
# (forward) and one warp-register-inverse kernel (decompress). There is no native
# SZp CLI wired into this repo, so this is an FZGM-only specialization showcase,
# not a native-parity or container-compatibility claim.
memory_strategy = "PREALLOCATE"

[[stage]]
name = "quant"
type = "Quantizer"
input_type = "float32"
code_type = "uint32"
error_bound = 1e-3
error_bound_mode = "ABS"
linear_mode = true

[[stage]]
name = "lrz"
type = "Lorenzo"
data_type = "int32"
block_size = 128
inputs = [{from = "quant", port = "codes"}]

[[stage]]
name = "ab"
type = "AdaptiveBitpack"
input_type = "int32"
block_size = 128
inputs = [{from = "lrz"}]
