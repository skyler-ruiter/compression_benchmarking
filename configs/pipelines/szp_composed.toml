[pipeline]
# cuSZp-style plain modular composition with a larger block.
#   Quantizer(linear) -> Lorenzo(block_size=128) -> AdaptiveBitpack(block_size=128)
#
# This is the same component chain and plain packing policy as the FZGM cuSZp2
# reconstruction, with block_size changed from 32 to 128. It demonstrates that a
# composed pipeline can expose an algorithm parameter that the native CLI fixes.
#
# Under FZ_SPECIALIZE=auto the whole chain fuses into one warp-register kernel
# (forward) and one warp-register-inverse kernel (decompress). There is no native
# native cuSZp B=128 reference, so this is an FZGM-only parameter-exploration
# point, not a native-parity or container-compatibility claim.
memory_strategy = "PREALLOCATE"

[[stage]]
name = "quant"
type = "Quantizer"
input_type = "float32"
code_type = "uint32"
error_bound = 1e-3
error_bound_mode = "ABS"
linear_mode = true

[[stage]]
name = "lrz"
type = "Lorenzo"
data_type = "int32"
block_size = 128
inputs = [{from = "quant", port = "codes"}]

[[stage]]
name = "ab"
type = "AdaptiveBitpack"
input_type = "int32"
block_size = 128
inputs = [{from = "lrz"}]
