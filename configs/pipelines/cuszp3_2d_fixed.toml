[pipeline]
# cuSZp3 FIXED mode, 2-D — faithful port.
#   Quantizer(linear) -> TiledLorenzo(8x8, predict=false) -> AdaptiveBitpack(64)
#
# Native cuSZp3 `-m fixed -d 2` is quantize -> per-8x8-tile fixed-rate pack, with
# NO Lorenzo delta (cuSZp_kernels_2D_f32.cu). The old cuszp3_fixed.toml used a flat
# AdaptiveBitpack(64) over 1-D 64-runs, which does not reproduce the 2-D tile
# geometry and diverges on structured data. This preset reproduces native fixed's
# per-tile fixed-rate layout: TiledLorenzo in `predict=false` mode does the tile-major
# reorder + zero-padding WITHOUT the delta, and AdaptiveBitpack(block_size=64) packs
# each 8x8 tile as one block. Standard single-precision quantizer (no
# linear_high_precision) — the faithful match for native cuSZp numerics.
# cuSZp3: Huang et al., SC'25.
memory_strategy = "PREALLOCATE"

[[stage]]
name = "quant"
type = "Quantizer"
input_type = "float32"
code_type = "uint32"
error_bound = 1e-3
error_bound_mode = "ABS"
linear_mode = true

[[stage]]
name = "tl"
type = "TiledLorenzo"
data_type = "int32"
tile_x = 8
tile_y = 8
tile_z = 1
predict = false
inputs = [{from = "quant", port = "codes"}]

[[stage]]
name = "ab"
type = "AdaptiveBitpack"
input_type = "int32"
block_size = 64
inputs = [{from = "tl"}]
