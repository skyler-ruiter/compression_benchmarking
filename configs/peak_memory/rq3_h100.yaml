# Peak device memory study for FZGM paper RQ3 ("How does graph-wide memory planning
# and specialization affect the memory required to execute a compressor?").
#
# Run with tools/peak_memory/run_peak_memory.py (NOT `benchkit run`: this is a
# standalone NVML/probe measurement that reuses benchkit adapters for argv).
# Protocol, metrics and caveats: docs/peak_memory_methodology.md (+ DESIGN D46/D47).
#
# Framing decisions (author, 2026-09-28):
#   - native, FZGM staged, FZGM specialized are SEPARATE curves; no per-cell
#     min(staged, specialized) (evaluation_setup_review.md decision #6).
#   - planning ablation: PREALLOCATE+coloring (default) vs PREALLOCATE --no-coloring
#     vs MINIMAL, each x FZ_SPECIALIZE off/auto where specialization applies.
#   - cuSZ and FSZ never specialize -> staged only. szp_composed dropped (FZGM-only).
#   - FZ-GPU excluded (paper family set).
#
# FIELD SET IS NOT CORPUS-REPRESENTATIVE: eight fields chosen to span 11.5 MB-1.12 GB
# and resolve the native/FZGM crossover. Do not aggregate across it as a "typical" ratio.

name: peak_memory_rq3_h100
error: {mode: rel_range, bound: 1.0e-3}
reps: 3                     # process repetitions per cell; reported peak = max over reps
sample_period_ms: 0.5       # NVML poll period

fields:                     # [dataset, field] from configs/datasets.yaml
  - [EXAALT, vx]
  - [CESM-2D, CLDHGH]
  - [HURR, CLOUD]
  - [MIRANDA, density]
  - [NYX, temperature]
  - [CESMATM-3D, CLDICE]
  - [NWCHEM, t631]
  - [HACC, vx]

fzgm:
  expected_git_sha: d511ebc
  # Planning arms. `strategy`/`coloring` map to fzgmod-cli --strategy / --no-coloring.
  planning_arms:
    planned:     {strategy: preallocate, coloring: true}    # default; paper configuration
    no_coloring: {strategy: preallocate, coloring: false}   # planning's liveness aliasing off
    minimal:     {strategy: minimal,     coloring: true}    # alloc-on-demand; coloring is inert
  # Extra process shape for the planned arm only: compress (-z) and decompress (-x) as
  # two processes, cell peak = max. Matches native cuSZ/PFPL, which are two-process tools.
  split_process_arms: [planned]

# Pipelines mirror configs/experiments/specialization_vs_native_full.yaml (the H100
# publication run) and fsz_vs_native_full_standard.yaml. `by_rank` keys on the number
# of field dims (1/2/3) for the dimension-matched cuSZp3 variants.
families:
  cusz:
    specializes: false
    native: {compressor: cusz, pipeline: default}
    fzgm: configs/pipelines/cusz.toml
  cuszp2_outlier:
    specializes: true
    native: {compressor: cuszp2, pipeline: outlier}
    fzgm: configs/pipelines/cuszp2_sp.toml
  cuszp2_plain:
    specializes: true
    native: {compressor: cuszp2, pipeline: plain}
    fzgm: configs/pipelines/cuszp2_plain_sp.toml
  cuszp3_outlier:
    specializes: true
    by_rank:
      1: {native: {compressor: cuszp3, pipeline: outlier},    fzgm: configs/pipelines/cuszp2_sp.toml}
      2: {native: {compressor: cuszp3, pipeline: "outlier:2d"}, fzgm: configs/pipelines/cuszp3_outlier_sp.toml}
      3: {native: {compressor: cuszp3, pipeline: "outlier:3d"}, fzgm: configs/pipelines/cuszp3_3d_sp.toml}
  cuszp3_plain:
    specializes: true
    by_rank:
      1: {native: {compressor: cuszp3, pipeline: plain},    fzgm: configs/pipelines/cuszp2_plain_sp.toml}
      2: {native: {compressor: cuszp3, pipeline: "plain:2d"}, fzgm: configs/pipelines/cuszp3_plain_sp.toml}
      3: {native: {compressor: cuszp3, pipeline: "plain:3d"}, fzgm: configs/pipelines/cuszp3_3d_plain_sp.toml}
  pfpl:
    specializes: true
    # Shadow rebuild (-cudart shared) so the probe sees allocations; NVML does not
    # need it. tools/peak_memory/build_pfpl_shadow.sh. The pinned static binaries are
    # also measured (arm native_static) on two fields to show NVML agrees across builds.
    native: {compressor: pfpl, pipeline: default, bin_dir_env: PEAKMEM_PFPL_SHADOW_BIN_DIR,
             static_bin_dir_env: PFPL_BIN_DIR,
             static_control_fields: [CESM-2D/CLDHGH, HACC/vx]}
    fzgm: configs/pipelines/pfpl.toml
  fsz:
    specializes: false
    # Stock FSZ CLI round trip (--csv), not the repo-built fsz_hosttime harness.
    native: {compressor: fsz, pipeline: default, stock_cli: true}
    fzgm: configs/pipelines/fsz.toml

# Native tool pins (verified against checkout HEADs at run start).
native_pins:
  cusz:   {commit: e1c0135f2309921e13e7dac72c00101381e60c23, checkout: cuSZ}
  cuszp2: {commit: 240240b2f8cc3984236c6cea1f18658ef535a81c, checkout: cuSZp-V2.0.1, vendored: true}
  cuszp3: {commit: da90afb42770fcef6129cb586cf185c7d54c614c, checkout: cuSZp-V3.0.0, vendored: true}
  pfpl:   {commit: 36f5aaef42744ed78b4d1525b03a7fb2168b363c, checkout: PFPL}
  fsz:    {commit: 43240ed1149ff4c48b52e74c9d8ba998ca5bcf8c, checkout: FSZ}
