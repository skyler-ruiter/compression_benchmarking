# NWChem quantum-chemistry tensors (1-D f64). Raw arrays with NO header — the
# tarball's own readbin.cpp just does numDoubles = size/sizeof(double), which is how
# the element counts below were derived (and they divide exactly).
#
# WARNING: only `t631` matches the 102,953,248 elements advertised on
# sdrbench.github.io. `acd` and `ccd` are 6.4 GB and 5.7 GB single fields — by far
# the largest in this corpus (HACC/vx, the previous maximum, is 1.1 GB).
#
# MEASURED peak device memory for `acd` (6.11 GB payload) on the H100, dtype
# correctly rendered as f64:
#     cusz 20.6 GB | cuszp2_plain 21.9 GB | cuszp3_1d 21.9 GB | pfpl 35.0 GB
# i.e. 3.4x-5.7x the payload. All four succeed on the 80 GB H100 and would on the
# 141 GB H200, but pfpl at 35 GB does not leave usable headroom on the 40 GB A100
# and exceeds the 32 GB MI100 outright. `acd`/`ccd` are therefore registered but
# EXCLUDED from the cross-machine sweep (fzgm_vs_native_full.yaml scopes NWCHEM to
# t631); use them for targeted large-memory experiments on H100/H200 only.
# (If you test these by hand, render input_type to float64 first — invoking a preset
# straight from configs/pipelines with -t f64 silently reads the data as f32, which
# is D27 and will give you plausible-looking but wrong CR/memory numbers.)
NWCHEM:
  dtype: f64
  dim_order: fast-to-slow
  root: ${BENCHKIT_DATA_ROOT}/NWCHEM_102953248
  fields:
    t631: {dims: [102953248], path: 631-tst.bin.d64}   # 823 MB — the advertised field
    acd:  {dims: [801098891], path: acd-tst.bin.d64}   # 6.4 GB — large-memory only
    ccd:  {dims: [712996037], path: ccd-tst.bin.d64}   # 5.7 GB — large-memory only

