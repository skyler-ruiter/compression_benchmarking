# QMCPACK quantum Monte Carlo orbitals (1 file, 288×69×69×115, f32, 4-D)
# File is in the 115x69x69x288/ subdirectory; fast-to-slow: orbital (288) is fastest.
QMCPACK:
  dtype: f32
  dim_order: fast-to-slow
  root: ${BENCHKIT_DATA_ROOT}/QMCPACK/115x69x69x288
  fields:
    einspline: {dims: [288, 69, 69, 115], path: einspline_115_69_69_288.f32}

# QMCPACK split into individual 3-D orbitals — the form the adapters can actually run.
# The 4-D QMCPACK entry above is unusable in practice: no adapter here handles 4-D
# (SPERR and zfp reject it outright, cuSZ/cuSZ-Hi/cuSZp take at most 3-D), which is why
# it has never appeared in an experiment. Splitting along the slowest axis is the honest
# reshape — an orbital IS an independent 3-D volume, whereas folding the orbital axis
# into a spatial one would fabricate locality across unrelated orbitals and distort
# every predictor's error.
#
# Generated by: python scripts/extract_qmcpack_orbitals.py --n 8
# Source is the ORBITAL-MAJOR 288x115x69x69 file (orbital index slowest, so each orbital
# is one contiguous block); the 115x69x69x288 file used above interleaves the orbital
# axis and cannot be split this way.
#
# 8 of 288 orbitals, evenly spaced across the index range rather than the first 8:
# orbital character varies systematically with index (orbital 0 spans [-7.28, 0.0009]
# while mid-range ones are near-symmetric, e.g. orbital 82 at [-12.41, 12.41]), so the
# first 8 would sample one end and misrepresent the dataset. All 288 would add ~15.5k
# cells (~17 h) for one 0.6 GB dataset — out of proportion to everything else.
# Re-run the script with a larger --n and regenerate this block via --emit-yaml to widen.
QMCPACK-3D:
  dtype: f32
  dim_order: fast-to-slow
  root: ${BENCHKIT_DATA_ROOT}/QMCPACK/orbitals_69x69x115
  fields:
    orbital_000: {dims: [69, 69, 115], path: orbital_000.f32}
    orbital_041: {dims: [69, 69, 115], path: orbital_041.f32}
    orbital_082: {dims: [69, 69, 115], path: orbital_082.f32}
    orbital_123: {dims: [69, 69, 115], path: orbital_123.f32}
    orbital_164: {dims: [69, 69, 115], path: orbital_164.f32}
    orbital_205: {dims: [69, 69, 115], path: orbital_205.f32}
    orbital_246: {dims: [69, 69, 115], path: orbital_246.f32}
    orbital_287: {dims: [69, 69, 115], path: orbital_287.f32}

# ----- SDRBench datasets added 2026-07-28 -------------------------------------
# Downloaded to the 200 GB volume alongside the originals. Dims below are
# fast-to-slow, i.e. the REVERSE of the order in the SDRBench filenames (a file
# named 130x1480x1552 is C-order [130][1480][1552], so 1552 varies fastest) —
# the same convention CESMATM-3D already follows. Every entry's element count was
# checked against the file size on disk rather than taken from the website.

# S3D combustion DNS — statistically planar premixed flame (11 3-D f64 variables).
# NOT shipped as 11 files: the tarball contains 5 timestep blobs of 11,000,000,000
# bytes each, every one holding all 11 variables of 500^3 f64 stacked variable-major
# (11 * 500^3 * 8 = 11e9 exactly), per the tarball's own template.txt. Split into real
# files by scripts/extract_s3d_variables.py, which asserts the layout rather than
# assuming it (the six mass fractions must fall in [0,1]).
#
# Layout confirmed physically as well as dimensionally: N2 comes out at 0.7369 mass
# fraction (air), and PRES at 0.714 x its 1.41837e5 Pa normalizer = 101.3 kPa = 1 atm.
#
# ONE timestep (1.1000E-03) is split. The other four in the tarball are the same 11
# variables at later simulation times — far less varied than the 11 variables are from
# each other — and cost 11 GB each to expand, so they are left packed. Re-run the
# script with --timestep to use a different one.
S3D:
  dtype: f64
  dim_order: fast-to-slow
  root: ${BENCHKIT_DATA_ROOT}/S3D_500x500x500/vars_500x500x500
  fields:
