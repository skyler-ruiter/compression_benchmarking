# ----- Throughput-scaling synthetic datasets ----------------------------------
# Generated by: python scripts/make_scaling_data.py --out-dir $BENCHKIT_DATA_ROOT/SCALING-SYNTH
#
# 1-D f32 arrays tiled from a real field (or a Brownian-motion synthetic seed)
# sized at exact decimal-GB boundaries to sweep throughput vs. data size on an
# A100-40GB. Files at 12 GB and 16 GB are expected to OOM (FZGM holds full array
# + scratch on-device) — their fail rows record the ceiling.
#
# Host-RAM note: quality computation in metrics.py reads both arrays as float64
# (2× the file size each); a 16 GB file needs ~96 GB host RAM transiently. Run
# on a BigRed200 gpu node (256 GB RAM) or skip quality with retain_decompressed=false.
# (Decompressed file is deleted after quality check; compressed .fzm is kept.)
#
# Sizes use decimal GB (1 GB = 1e9 bytes), matching the harness throughput unit.
SCALING-SYNTH:
  dtype: f32
  dim_order: fast-to-slow
  root: ${BENCHKIT_DATA_ROOT}/SCALING-SYNTH
  fields:
    synth_0p5GB:  {dims: [125000000],   path: synth_0p5GB.f32}   #  0.500 GB
    synth_1GB:    {dims: [250000000],   path: synth_1GB.f32}     #  1.000 GB
    synth_2GB:    {dims: [500000000],   path: synth_2GB.f32}     #  2.000 GB
    synth_4GB:    {dims: [1000000000],  path: synth_4GB.f32}     #  4.000 GB
    synth_8GB:    {dims: [2000000000],  path: synth_8GB.f32}     #  8.000 GB
    synth_12GB:   {dims: [3000000000],  path: synth_12GB.f32}    # 12.000 GB (likely OOM)
    synth_16GB:   {dims: [4000000000],  path: synth_16GB.f32}    # 16.000 GB (likely OOM)

# ── Derived: FZGM Lorenzo quant codes ────────────────────────────────────────
# NOT raw SDRBench data. These are the uint16 codes LorenzoQuant produces from
# CESM-2D at NOA (range-relative) eb=1e-3, radius=2048 — regenerate with:
#
#   python scripts/extract_quant_codes.py --dataset CESM-2D --fields all \
#       --eb 1e-3 --out-root ${BENCHKIT_DATA_ROOT}/derived
#
# They exist for one experiment: the back-end-isolation half of the nvCOMP
# comparison (configs/experiments/nvcomp_vs_fzgm_backend.yaml). FZGM's GPU-Zstd
# back end and nvCOMP's Zstd are both lossless coders, so the only way to compare
# THEM rather than FZGM's Lorenzo predictor is to feed both the identical codes.
#
# Two things a reader must not do with rows measured on this dataset:
#   - Do not quote their CR as a compression ratio for CESM-2D. It is a back-end
#     ratio over an already-2x-reduced intermediate, and it excludes the outlier
#     streams (0 outliers on these three fields at this bound, but not in general).
#   - Do not mix them into aggregates with raw-field rows. Different input, and
#     original_bytes here is the codes size, not the field size.
# Lossless runs only (error.mode: lossless). See docs/adapters/nvcomp.md.
CESM-2D-qcodes-noa1e-3:
  dtype: u16
  dim_order: fast-to-slow
  root: ${BENCHKIT_DATA_ROOT}/derived/CESM-2D_qcodes_noa0.001
  fields:
    CLDHGH: {dims: [3600, 1800], path: CLDHGH.u16}
    PRECT:  {dims: [3600, 1800], path: PRECT.u16}
    TS:     {dims: [3600, 1800], path: TS.u16}

# ── Derived Lorenzo quant-code datasets for the broadened nvCOMP parity check ──
# Generated by scripts/extract_quant_codes.py (LorenzoQuant only, no coder;
# quant_radius 2048, zigzag, NOA = range-relative bound). 5 source datasets x
# 3 error bounds. Consumed under error.mode: lossless by BOTH nvCOMP and FZGM's
# coder-only pipelines, so the two see byte-identical input.
#
# A ratio measured on these is a BACK-END ratio and must never be quoted as a
# compression ratio for the source field (D32). Outlier fractions are all
# <= 0.007% even at 1e-4, so the codes stream represents essentially the whole
# field at every bound here.
#
# CESM-2D-qcodes-noa0.001 is the same data as CESM-2D-qcodes-noa1e-3 above,
# under the generator's naming; the older name is kept because
