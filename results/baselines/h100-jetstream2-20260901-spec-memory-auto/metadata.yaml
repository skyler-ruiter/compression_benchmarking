result_summary: >
  peak_device_mb, eb 1e-3, CLDHGH: szp_composed specialized 79 in BOTH the
  coloring and no-coloring arm; cuszp2_sp 81 / 81; pfpl 137 / 137; cusz 112 / 112.
  Reading with the staged pair — CLDHGH szp_composed: staged+color 131,
  staged+nocolor 157, specialized 79 (both). Specialization's fused-internal
  buffer elision cuts peak ~40% vs staged+coloring, and makes coloring a no-op
  across the fused span (the buffers it would alias no longer exist). Holds
  across all fields: HACC/vx 5692 -> 3426, NYX/temp 2719 -> 1637, HURR/TC 506 -> 305.
  cusz (never specializes) is the control — flat across all four arms.

verification: >
  `benchkit verify` exits non-zero: timing_reliability 0/16 (expected — memory
